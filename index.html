<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pikachu UI</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

        <div class="left">

        <img
        src="https://i.pinimg.com/736x/aa/85/9d/aa859de5e0bf94882f4648a5c4d57e9f.jpg"
        class="logo"
        alt=""
      >

      <div class="content">
        <h4>POKEMON GEN I</h4>

        <h1>Pikachu</h1>

        <p>
          Pikachu is an Electric-type Pokémon introduced
          in Generation I. Pikachu are small, chubby,
          and incredibly cute mouse-like Pokémon.
          They are almost completely covered by
          yellow fur.
        </p>

        <div class="count">
          <span class="line"></span>
          <span>01 / 08</span>
        </div>
      </div>

       <!-- Pokeball -->
      <div class="pokeball"></div>

    </div>
<!-- RIGHT SECTION -->
    <div class="right">
   

      <div class="menu">
        <span></span>
        <span></span>
        <span></span>
      </div>

            <img
        src="https://pngimg.com/uploads/pokemon/pokemon_PNG148.png"
        class="pikachu"
        alt=""
      >
      <div class="dots">
        <span class="active"></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

  </div>

</body>
</html>
